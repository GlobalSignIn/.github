name: Secret & Credential Scan (Reusable)

on:
  workflow_call:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # LAYER 1: Gitleaks scans entire PR diff
      # Catches known secret patterns across ALL changed files
      # ============================================================
      - name: Run Gitleaks full PR scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # LAYER 2: Gitleaks scans .env files specifically
      # Scans raw file content, not just the diff
      # ============================================================
      - name: Scan .env files in PR
        run: |
          # Install Gitleaks
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

          # Find all .env files changed in this PR
          ENV_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '(^|/)\.env')

          if [ -z "$ENV_FILES" ]; then
            echo "✅ No .env files changed in this PR"
            exit 0
          fi

          echo "🔍 .env file(s) detected in PR:"
          echo "$ENV_FILES"
          echo "---"

          FAILED=0
          WARNED=0

          for FILE in $ENV_FILES; do
            # Skip deleted files
            if [ ! -f "$FILE" ]; then
              echo "⏭️  Skipping deleted file: $FILE"
              continue
            fi

            echo "🔍 Scanning: $FILE"

            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --no-git \
              --path "$FILE" \
              --verbose \
              || FAILED=1

            # LOW entropy scan — warns only
            # Uses .gitleaks-warn.toml with entropy = 0
            gitleaks detect \
              --source . \
              --config .gitleaks-warn.toml \
              --no-git \
              --path "$FILE" \
              --verbose \
              || WARNED=1  
          done
          
          if [ "$WARNED" -eq 1 ]; then
            echo "::warning::⚠️  Low entropy values detected in .env file(s)"
            echo "::warning::⚠️  These may not be secrets but please review before merging"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::🚨 PR blocked — credentials detected in .env file(s)"
            exit 1
          fi

          echo "✅ Scan complete"
