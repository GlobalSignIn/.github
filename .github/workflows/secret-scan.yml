name: Secret & Credential Scan (Reusable)

on:
  workflow_call:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks full PR scan
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan .env files in PR
        run: |
          ENV_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '(^|/)\.env')

          if [ -z "$ENV_FILES" ]; then
            echo "✅ No .env files changed in this PR"
            exit 0
          fi

          echo "🔍 .env file(s) detected in PR:"
          echo "$ENV_FILES"
          echo "---"

          FAILED=0
          WARNED=0

          for FILE in $ENV_FILES; do
            if [ ! -f "$FILE" ]; then
              echo "⏭️  Skipping deleted file: $FILE"
              continue
            fi

            echo "🔍 Scanning: $FILE"

            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --no-git \
              --path "$FILE" \
              --verbose \
              || FAILED=1

            gitleaks detect \
              --source . \
              --config .gitleaks-warn.toml \
              --no-git \
              --path "$FILE" \
              --verbose \
              || WARNED=1
          done

          if [ "$WARNED" -eq 1 ]; then
            echo "::warning::⚠️  Low entropy values detected in .env file(s)"
            echo "::warning::⚠️  Please review before merging"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::🚨 PR blocked — credentials detected in .env file(s)"
            exit 1
          fi

          echo "✅ All .env files are clean"
