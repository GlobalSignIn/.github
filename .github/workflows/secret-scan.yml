name: Secret & Credential Scan (Reusable)

on:
  workflow_call:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout gitleaks config from .github repo
        uses: actions/checkout@v4
        with:
          repository: GlobalSignIn/.github
          path: .gitleaks-config
          ref: main

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f 4 | tr -d 'v')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks full PR scan
        # continue-on-error handles Action-level failure, 
        # but '|| true' ensures the shell command itself returns success.
        continue-on-error: true
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks-config/.gitleaks.toml \
            --verbose || true

      - name: Scan .env files in PR
        run: |
          # Detect only files matching the .env pattern changed in this PR
          ENV_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD \
            | grep -E '(^|/)\.env' || true)
          
          if [ -z "$ENV_FILES" ]; then
            echo "✅ No .env files changed in this PR"
            exit 0
          fi
          
          echo "🔍 .env file(s) detected in PR:"
          echo "$ENV_FILES"
          echo "---"
          
          FAILED=0
          WARNED=0
          BLOCKING_FILES=""
          WARNING_FILES=""
          
          for FILE in $ENV_FILES; do
            if [ ! -f "$FILE" ]; then
              echo "⏭️  Skipping deleted file: $FILE"
              continue
            fi
            
            echo "🔍 Scanning: $FILE"
            
            # BLOCKING CHECK: Fails the build if rules in .gitleaks.toml are met
            if ! gitleaks detect \
              --source "$FILE" \
              --config .gitleaks-config/.gitleaks.toml \
              --no-git \
              --verbose; then
              FAILED=1
              BLOCKING_FILES="$BLOCKING_FILES $FILE"
            fi
            
            # WARNING CHECK: Flags low-entropy values but doesn't exit 1 by itself
            if ! gitleaks detect \
              --source "$FILE" \
              --config .gitleaks-config/.gitleaks-warn.toml \
              --no-git \
              --verbose; then
              WARNED=1
              WARNING_FILES="$WARNING_FILES $FILE"
            fi
          done
          
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "                  SCAN SUMMARY"
          echo "═══════════════════════════════════════════════"
          
          if [ "$WARNED" -eq 1 ]; then
            echo "::warning::⚠️  Low entropy values detected in:$WARNING_FILES"
            echo "⚠️  WARNINGS in:$WARNING_FILES"
          fi
          
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::🚨 PR blocked — credentials detected in:$BLOCKING_FILES"
            echo "❌ BLOCKING in:$BLOCKING_FILES"
            echo ""
            echo "Action required:"
            echo "  1. Remove the secrets from the file(s) above"
            echo "  2. Rotate any real credentials that were committed"
            echo "  3. Use placeholder values in .env.sample/.env.example files"
            exit 1
          fi
          
          echo "✅ All .env files are clean"
